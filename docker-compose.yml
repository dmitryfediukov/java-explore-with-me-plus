services:
  stats-server:
    build: ./stats/stats-server
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: ${STATS_DB_USER:-stats}
      SPRING_DATASOURCE_PASSWORD: ${STATS_DB_PASSWORD:-stats}
    depends_on:
      stats-db:
        condition: service_healthy

  stats-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: ${STATS_DB_USER:-stats}
      POSTGRES_PASSWORD: ${STATS_DB_PASSWORD:-stats}
    volumes:
      - stats-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  stats-data:

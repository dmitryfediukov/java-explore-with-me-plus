services:
  stats-server:
    build: ./stats/stats-server
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: ${STATS_DB_USER:-stats}
      SPRING_DATASOURCE_PASSWORD: ${STATS_DB_PASSWORD:-stats}
    depends_on:
      stats-db:
        condition: service_healthy

  stats-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: ${STATS_DB_USER:-stats}
      POSTGRES_PASSWORD: ${STATS_DB_PASSWORD:-stats}
    volumes:
      - stats-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  main-service:
    build: ./ewm-main-service
    ports:
      - "${MAIN_SERVICE_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://main-db:5432/ewm
      SPRING_DATASOURCE_USERNAME: ${MAIN_DB_USER:-ewm}
      SPRING_DATASOURCE_PASSWORD: ${MAIN_DB_PASSWORD:-ewm}
      STATS_SERVER_URL: http://stats-server:9090
    depends_on:
      main-db:
        condition: service_healthy
      stats-server:
        condition: service_started

  main-db:
    image: postgres:16.1
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: ${MAIN_DB_USER:-ewm}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:-ewm}
    volumes:
      - main-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  stats-data:
  main-data:
